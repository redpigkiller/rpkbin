[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "rpkbin"
version = "0.2.1"
description = "General-purpose utilities for IC design and verification workflows (MapBV, TablePack, JobManager, Wave Web GUI)."
readme = "README.md"
authors = [
    { name = "redpigkiller", email = "hongrunlu511@gmail.com" }
]
license = "MIT AND ISC"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.21",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
]

[project.optional-dependencies]
fixed = ["apytypes>=0.5.0"]
table = ["brotli>=1.2"]
# The 6.12.0 Linux/Python 3.11 matrix aborts during interpreter finalization.
calc  = ["apytypes>=0.5.0", "PySide6>=6.5.0,<6.12", "qtconsole>=5.7.2,<6", "ipykernel>=6.29,<8", "jupyter-client>=8.6,<9", "matplotlib>=3.8,<4"]
all   = ["brotli>=1.2", "apytypes>=0.5.0", "PySide6>=6.5.0,<6.12", "qtconsole>=5.7.2,<6", "ipykernel>=6.29,<8", "jupyter-client>=8.6,<9", "matplotlib>=3.8,<4"]

[project.urls]
Homepage   = "https://github.com/redpigkiller/rpkbin"
Repository = "https://github.com/redpigkiller/rpkbin"

[project.scripts]
rpk-wave = "rpkbin.wave.cli:main"
rpk-calc = "rpkbin.calc.cli:main"

[tool.setuptools.packages.find]
include = ["rpkbin*"]
